# Vendored manifest: upstream workspace inheritance expanded, see PATCH.md.

[package]
"authors" = ["nathanielsimard <nathaniel.simard.42@gmail.com>"]
"categories" = ["science"]
"description" = "WGPU runtime for the CubeCL"
"edition" = "2024"
"keywords" = ["gpu", "wgpu", "webgpu", "gpgpu"]
"license" = "MIT OR Apache-2.0"
"name" = "cubecl-wgpu"
"readme" = "README.md"
"repository" = "https://github.com/tracel-ai/cubecl/tree/main/crates/cubecl-wgpu"
"version" = "0.11.0-pre.4"

[lints]
"rust" = { "warnings" = "warn" }
"clippy" = { "doc_markdown" = "warn" }
"rustdoc" = { "broken_intra_doc_links" = "warn", "invalid_html_tags" = "warn" }

[features]
"default" = ["cubecl-server/default", "cubecl-common/default", "cubecl-core/default"]
"exclusive-memory-only" = ["cubecl-server/exclusive-memory-only"]
"std" = ["cubecl-server/std", "cubecl-common/std", "cubecl-core/std", "cubecl-cpp/std", "cubecl-opt/std", "pliron/std", "sanitize-filename"]
# 'msl' and 'spirv' features are exclusive
"msl" = ["cubecl-cpp/metal", "dep:objc2", "dep:objc2-foundation", "dep:objc2-metal"]
"profile-tracy" = ["tracy-client"]
"spirv" = ["cubecl-spirv", "ash", "tracel-ash", "cubecl-common/hash"]
"deny-validation-errors" = ["wgpu-hal/validation_canary"]
"pliron-dump" = ["std", "cubecl-cpp/pliron-dump", "cubecl-spirv?/pliron-dump"]
"vulkan-validate" = []
"renderdoc" = ["std", "dep:renderdoc"]
"tracing" = ["dep:tracing", "cubecl-server/tracing", "cubecl-common/tracing", "cubecl-core/tracing"]

[dependencies]
"log" = { "default-features" = false, "version" = "^0.4.22" }
"tracing" = { "version" = "^0.1.43", "default-features" = false, "features" = ["attributes"], "optional" = true }
"cubecl-common" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"cubecl-core" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"cubecl-environment" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"cubecl-ir" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"cubecl-opt" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"cubecl-server" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "default-features" = false }
"derive_more" = { "version" = "2", "default-features" = false, "features" = ["not", "add", "mul", "add_assign", "mul_assign", "display", "debug", "from", "into"] }
"half" = { "version" = "2.5", "features" = ["alloc", "num-traits", "serde"], "default-features" = false }
"itertools" = { "version" = "0.15", "default-features" = false, "features" = ["use_alloc"] }
"pliron" = { "version" = "0.18", "default-features" = false }
"sanitize-filename" = { "version" = "0.6", "optional" = true }
"thiserror" = { "version" = "2", "default-features" = false }
"tracy-client" = { "version" = "0.18.0", "optional" = true }
"ash" = { "version" = "0.38", "optional" = true }
"cubecl-spirv" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "optional" = true }
"tracel-ash" = { "version" = "0.39.5", "optional" = true }
"cubecl-cpp" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "features" = ["metal"], "optional" = true }
"wgpu-hal" = { "version" = "^30.0.0", "optional" = true }
"bytemuck" = { "version" = "1.16.1" }
"derive-new" = { "version" = "0.7.0", "default-features" = false }
"hashbrown" = { "version" = "0.17" }
"cfg-if" = { "version" = "1.0.0" }

[target.'cfg(target_family = "wasm")'.dependencies]
"wasm-bindgen-futures" = { "version" = "0.4.45" }

[target.'cfg(not(target_os = "macos"))'.dependencies]
"renderdoc" = { "version" = "0.12", "optional" = true }
"wgpu" = { "version" = "^30.0.0", "features" = ["fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(target_os = "macos")'.dependencies]
"wgpu" = { "version" = "^30.0.0", "features" = ["vulkan-portability", "fragile-send-sync-non-atomic-wasm"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
"objc2" = { "version" = "0.6", "optional" = true }
"objc2-foundation" = { "version" = "0.3", "optional" = true }
"objc2-metal" = { "version" = "0.3", "features" = ["MTLLibrary"], "optional" = true }

[dev-dependencies]
"cubecl-core" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "features" = ["export_tests"] }
"cubecl-std" = { "git" = "https://github.com/tracel-ai/cubecl", "rev" = "467522442c7b68f02c7ff0c84b2e249e36d8da91", "version" = "=0.11.0-pre.4", "features" = ["export_tests"] }
"half" = { "version" = "2.5", "features" = ["alloc", "num-traits", "serde"], "default-features" = false }
"paste" = { "version" = "1" }
"test-log" = { "version" = "^0.2", "default-features" = false, "features" = ["trace"] }

[build-dependencies]
"cfg_aliases" = { "version" = "0.2.2" }
