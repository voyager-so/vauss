<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="speed-title speed-desc"><title id="speed-title">Training time at an equal one-million splat cap</title><desc id="speed-desc">Mean training time: Vauss 126.86 seconds, VkSplat 194.96 seconds, gsplat-MCMC 679.37 seconds. Seven scenes, three runs per scene, L40S, October 9 2026. Lower is better.</desc><rect width="900" height="350" rx="14" fill="#f6f8fa"/><g font-family="system-ui,sans-serif" fill="#1f2937"><text x="30" y="40" font-size="22" font-weight="700">Same splat cap. 5.4× faster training.</text><text x="30" y="67" font-size="14" fill="#59636e">Mean training time · 7 scenes × 3 runs · L40S · lower is better</text><text x="30" y="121" font-size="17" font-weight="700">Vauss</text><rect x="210" y="98" width="112.04" height="36" rx="5" fill="#167a5b"/><text x="338" y="122" font-size="17" font-weight="700">127 seconds</text><text x="30" y="184" font-size="17">VkSplat</text><rect x="210" y="161" width="172.18" height="36" rx="5" fill="#8a9cb0"/><text x="398" y="185" font-size="17">195 seconds</text><text x="30" y="247" font-size="17">gsplat-MCMC</text><rect x="210" y="224" width="600" height="36" rx="5" fill="#586b83"/><text x="810" y="286" font-size="17" text-anchor="end">679 seconds</text><text x="30" y="323" font-size="13" fill="#59636e">1M splats · 30k steps · measured Oct 9, 2026 · source: benchmark receipts</text></g></svg>