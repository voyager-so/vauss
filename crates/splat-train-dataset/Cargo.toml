# Derived from Brush (https://github.com/ArthurBrussee/brush) commit 1388f74c, Apache-2.0.
# Forked into voyager-so/vauss; see crates/splat-train/NOTICE.
[package]
name = "splat-train-dataset"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"

[lib]
name = "brush_dataset"

[dependencies]
brush-render = { path = "../splat-train-render", package = "splat-train-render" }
brush-vfs = { path = "../splat-train-vfs", package = "splat-train-vfs" }
brush-serde = { path = "../splat-train-serde", package = "splat-train-serde" }
colmap-reader = { path = "../splat-train-colmap", package = "splat-train-colmap" }

burn.workspace = true

thiserror = { workspace = true }
image = { workspace = true, features = ["exr"] }
jpeg-decoder.workspace = true
serde.workspace = true
serde_json.workspace = true
glam.workspace = true

tracing.workspace = true
log.workspace = true
rand.workspace = true

brush-async = { path = "../splat-train-async", package = "splat-train-async" }
clap.workspace = true
parse-size.workspace = true
itertools = "0.15"

[target.'cfg(target_family = "wasm")'.dependencies]
tokio = { version = "1", features = ["io-util"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { workspace = true, features = ["io-util", "fs", "macros"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tempfile = "3.23.0"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.cargo-shear]
ignored = ["getrandom"]
