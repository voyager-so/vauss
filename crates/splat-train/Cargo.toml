# Derived from Brush (https://github.com/ArthurBrussee/brush) commit 1388f74c, Apache-2.0.
# Forked into voyager-so/vauss; see crates/splat-train/NOTICE.
[package]
name = "splat-train"
edition.workspace = true
version.workspace = true
license = "Apache-2.0"

[lib]
name = "brush_train"

[features]
debug-validation = ["brush-render/debug-validation"]

[dependencies]
brush-render = { path = "../splat-train-render", package = "splat-train-render" }
brush-dataset = { path = "../splat-train-dataset", package = "splat-train-dataset" }
brush-loss = { path = "../splat-train-loss", package = "splat-train-loss" }
brush-serde = { path = "../splat-train-serde", package = "splat-train-serde" }
lpips = { path = "../splat-train-lpips", package = "splat-train-lpips" }

anyhow.workspace = true
image.workspace = true
clap.workspace = true
serde.workspace = true
glam.workspace = true
rand.workspace = true
tracing.workspace = true
log.workspace = true
hashbrown.workspace = true
ball-tree.workspace = true
rayon.workspace = true

tokio = { version = "1", features = ["io-util", "rt"] }
burn = { workspace = true, features = ["autodiff"] }
burn-cubecl.workspace = true
brush-cube = { path = "../splat-train-cube", package = "splat-train-cube" }

# The workspace tokio is "full"; its net half (mio) can't build for wasm. Wasm gets only the
# features listed above, native keeps exactly the workspace features it had.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio.workspace = true
sha2.workspace = true
serde_json.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }
wasm-bindgen-test = "0.3"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
getrandom = { version = "0.4", features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.cargo-shear] # or [workspace.metadata.cargo-shear]
ignored = ["getrandom"]
