<!-- VXCORE: the pure game logic (voxel world, greedy mesher, DDA raycast, player + debris physics), without
     three.js, so it can be exercised headless (node: extract this script and run it with a `window` object).
     Physics runs in voxel-cell units: cell (x,y,z) spans [x,x+1) and sits at origin + edge*(x,y,z) in the world. -->
<script id="vxcore">
(function (root) {
  "use strict";
  const CS = 32, CS3 = CS * CS * CS, P = 34, P2 = P * P, P3 = P * P * P;
  const ckey = (cx, cy, cz) => cx + cy * 2048 + cz * 4194304;
  const EPS = 1e-6, SKIN = 1e-3;

  class World {
    constructor(v) {
      this.edge = v.edge; this.origin = v.origin.slice(); this.dims = v.dims.slice();
      this.chunks = new Map(); this.count = 0; this.dirty = new Set();
      this._k = -1; this._c = undefined;
    }
    get(cx, cy, cz) { return this.chunks.get(ckey(cx, cy, cz)); }
    ensure(cx, cy, cz) {
      const k = ckey(cx, cy, cz);
      let c = this.chunks.get(k);
      if (!c) {
        c = { cx, cy, cz, key: k, occ: new Uint8Array(CS3), rgb: new Uint8Array(CS3 * 3), n: 0, quads: 0, mesh: null, tex: null };
        this.chunks.set(k, c); this._k = -1;
      }
      return c;
    }
    inside(x, y, z) { return x >= 0 && y >= 0 && z >= 0 && x < this.dims[0] && y < this.dims[1] && z < this.dims[2]; }
    solid(x, y, z) {  // integer cell coords
      if (!(x >= 0 && y >= 0 && z >= 0 && x < this.dims[0] && y < this.dims[1] && z < this.dims[2])) return 0;
      const k = ckey(x >> 5, y >> 5, z >> 5);
      let c;
      if (k === this._k) c = this._c; else { c = this.chunks.get(k); this._k = k; this._c = c; }
      return c ? c.occ[(x & 31) | ((y & 31) << 5) | ((z & 31) << 10)] : 0;
    }
    rgb(x, y, z) {
      const c = this.inside(x, y, z) && this.get(x >> 5, y >> 5, z >> 5);
      if (!c) return null;
      const i = ((x & 31) | ((y & 31) << 5) | ((z & 31) << 10)) * 3;
      return [c.rgb[i], c.rgb[i + 1], c.rgb[i + 2]];
    }
    setCell(x, y, z, on, r, g, b) {
      if (!this.inside(x, y, z)) return false;
      const c = on ? this.ensure(x >> 5, y >> 5, z >> 5) : this.get(x >> 5, y >> 5, z >> 5);
      if (!c) return false;
      const i = (x & 31) | ((y & 31) << 5) | ((z & 31) << 10);
      if (on) {
        if (c.occ[i]) return false;
        c.occ[i] = 1; c.rgb[i * 3] = r; c.rgb[i * 3 + 1] = g; c.rgb[i * 3 + 2] = b; c.n++; this.count++;
      } else {
        if (!c.occ[i]) return false;
        c.occ[i] = 0; c.n--; this.count--;
      }
      this.touch(x, y, z);
      return true;
    }
    // Mark the cell's chunk dirty, plus every neighbour whose 1-cell padded border holds it (faces + AO).
    touch(x, y, z) {
      const cx = x >> 5, cy = y >> 5, cz = z >> 5, lx = x & 31, ly = y & 31, lz = z & 31;
      const xs = lx === 0 ? [0, -1] : lx === 31 ? [0, 1] : [0];
      const ys = ly === 0 ? [0, -1] : ly === 31 ? [0, 1] : [0];
      const zs = lz === 0 ? [0, -1] : lz === 31 ? [0, 1] : [0];
      for (const dx of xs) for (const dy of ys) for (const dz of zs) {
        const k = ckey(cx + dx, cy + dy, cz + dz);
        if ((dx | dy | dz) === 0 || this.chunks.has(k)) this.dirty.add(k);
      }
    }
    // Padded 34^3 occupancy of chunk c (and, if given, RGBA8 with alpha = occupancy; RGB for own cells only).
    padded(c, occ, rgba) {
      const bx = c.cx * CS - 1, by = c.cy * CS - 1, bz = c.cz * CS - 1;
      for (let z = 0; z < CS; z++) for (let y = 0; y < CS; y++) {
        const src = (y << 5) | (z << 10), dst = 1 + P * (y + 1) + P2 * (z + 1);
        for (let x = 0; x < CS; x++) {
          const o = c.occ[src + x];
          occ[dst + x] = o;
          if (rgba) {
            const s = (src + x) * 3, d = (dst + x) * 4;
            rgba[d] = c.rgb[s]; rgba[d + 1] = c.rgb[s + 1]; rgba[d + 2] = c.rgb[s + 2]; rgba[d + 3] = o ? 255 : 0;
          }
        }
      }
      for (let z = 0; z < P; z++) for (let y = 0; y < P; y++) {
        const edgeRow = z === 0 || z === P - 1 || y === 0 || y === P - 1;
        for (let x = 0; x < P; x += edgeRow ? 1 : P - 1) {
          const i = x + P * y + P2 * z, o = this.solid(bx + x, by + y, bz + z);
          occ[i] = o;
          if (rgba) { const d = i * 4; rgba[d] = rgba[d + 1] = rgba[d + 2] = 0; rgba[d + 3] = o ? 255 : 0; }
        }
      }
    }
    // Remove every solid cell whose centre is within r of (px,py,pz) and y >= minY (the floor slab below minY
    // is bedrock); pushes x,y,z,r,g,b of each to out.
    removeSphere(px, py, pz, r, out, minY = -Infinity) {
      const r2 = r * r;
      let n = 0;
      for (let z = Math.floor(pz - r); z <= Math.floor(pz + r); z++)
        for (let y = Math.floor(py - r); y <= Math.floor(py + r); y++)
          for (let x = Math.floor(px - r); x <= Math.floor(px + r); x++) {
            const dx = x + 0.5 - px, dy = y + 0.5 - py, dz = z + 0.5 - pz;
            if (y < minY || dx * dx + dy * dy + dz * dz > r2 || !this.solid(x, y, z)) continue;
            if (out) { const c = this.rgb(x, y, z); out.push(x, y, z, c[0], c[1], c[2]); }
            this.setCell(x, y, z, false);
            n++;
          }
      return n;
    }
    // SCORCH: darken (x0.7, once per cell) every solid cell within r of (px,py,pz): after a shot, the crater's
    // exposed walls and the bedrock floor inside it. Returns how many cells it darkened.
    scorch(px, py, pz, r) {
      const r2 = r * r;
      let n = 0;
      for (let z = Math.floor(pz - r); z <= Math.floor(pz + r); z++)
        for (let y = Math.floor(py - r); y <= Math.floor(py + r); y++)
          for (let x = Math.floor(px - r); x <= Math.floor(px + r); x++) {
            const dx = x + 0.5 - px, dy = y + 0.5 - py, dz = z + 0.5 - pz;
            if (dx * dx + dy * dy + dz * dz > r2 || !this.solid(x, y, z)) continue;
            const c = this.get(x >> 5, y >> 5, z >> 5), i = (x & 31) | ((y & 31) << 5) | ((z & 31) << 10);
            if (!c.sc) c.sc = new Uint8Array(CS3);
            if (c.sc[i]) continue;
            c.sc[i] = 1;
            for (let k = 0; k < 3; k++) c.rgb[i * 3 + k] = Math.round(c.rgb[i * 3 + k] * 0.7);
            this.touch(x, y, z); n++;
          }
      return n;
    }
    // Local surface normal at cell (x,y,z): the mean offset of the empty cells within r (null if none / balanced).
    surfaceNormal(x, y, z, r = 2) {
      let nx = 0, ny = 0, nz = 0;
      for (let dz = -r; dz <= r; dz++) for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++)
        if (!this.solid(x + dx, y + dy, z + dz)) { nx += dx; ny += dy; nz += dz; }
      const l = Math.hypot(nx, ny, nz);
      return l > 1e-6 ? [nx / l, ny / l, nz / l] : null;
    }
    // Amanatides-Woo DDA from o along unit d (cell units), at most maxT. {x,y,z, nx,ny,nz (entered face), t} or null.
    raycast(ox, oy, oz, dx, dy, dz, maxT) {
      let x = Math.floor(ox), y = Math.floor(oy), z = Math.floor(oz);
      if (this.solid(x, y, z)) return { x, y, z, nx: 0, ny: 0, nz: 0, t: 0 };
      const sx = dx > 0 ? 1 : -1, sy = dy > 0 ? 1 : -1, sz = dz > 0 ? 1 : -1;
      const tdx = dx !== 0 ? Math.abs(1 / dx) : Infinity, tdy = dy !== 0 ? Math.abs(1 / dy) : Infinity, tdz = dz !== 0 ? Math.abs(1 / dz) : Infinity;
      let tmx = dx !== 0 ? (sx > 0 ? x + 1 - ox : ox - x) * tdx : Infinity;
      let tmy = dy !== 0 ? (sy > 0 ? y + 1 - oy : oy - y) * tdy : Infinity;
      let tmz = dz !== 0 ? (sz > 0 ? z + 1 - oz : oz - z) * tdz : Infinity;
      let nx = 0, ny = 0, nz = 0, t = 0;
      for (let guard = 0; guard < 100000; guard++) {
        if (tmx < tmy && tmx < tmz) { x += sx; t = tmx; tmx += tdx; nx = -sx; ny = 0; nz = 0; }
        else if (tmy < tmz) { y += sy; t = tmy; tmy += tdy; nx = 0; ny = -sy; nz = 0; }
        else { z += sz; t = tmz; tmz += tdz; nx = 0; ny = 0; nz = -sz; }
        if (t > maxT) return null;
        if (this.solid(x, y, z)) return { x, y, z, nx, ny, nz, t };
      }
      return null;
    }
    // Top (cell y + 1) of the first solid cell at or below y in column (x,z), or null within maxCells.
    floorBelow(x, y, z, maxCells) {
      const cx = Math.floor(x), cz = Math.floor(z);
      for (let cy = Math.floor(y), n = 0; n <= maxCells; cy--, n++) if (this.solid(cx, cy, cz)) return cy + 1;
      return null;
    }
  }

  function decodeVXG1(bytes, v) {
    const dv = new DataView(bytes.buffer, bytes.byteOffset, bytes.byteLength);
    if (bytes.length < 8 || String.fromCharCode(bytes[0], bytes[1], bytes[2], bytes[3]) !== "VXG1") throw new Error("voxels: not a VXG1 file");
    const nChunks = dv.getUint32(4, true);
    const w = new World(v);
    let at = 8;
    for (let k = 0; k < nChunks; k++) {
      const cx = dv.getInt32(at, true), cy = dv.getInt32(at + 4, true), cz = dv.getInt32(at + 8, true), n = dv.getUint32(at + 12, true);
      at += 16;
      if (at + 4096 + 3 * n > bytes.length) throw new Error(`voxels: chunk ${k} truncated`);
      const c = w.ensure(cx, cy, cz), occ = c.occ, rgb = c.rgb;
      let j = at + 4096;
      for (let b = 0; b < 4096; b++) {
        const m = bytes[at + b];
        if (!m) continue;
        for (let bit = 0; bit < 8; bit++) {
          if (!(m & (1 << bit))) continue;
          const i = (b << 3) | bit;
          occ[i] = 1; rgb[i * 3] = bytes[j]; rgb[i * 3 + 1] = bytes[j + 1]; rgb[i * 3 + 2] = bytes[j + 2]; j += 3;
        }
      }
      if (j !== at + 4096 + 3 * n) throw new Error(`voxels: chunk ${k} has ${(j - at - 4096) / 3} set bits, header says ${n}`);
      c.n = n; w.count += n;
      at = j;
    }
    if (at !== bytes.length) throw new Error(`voxels: ${bytes.length - at} trailing bytes`);
    return w;
  }

  // Greedy mesher over a padded 34^3 occupancy: one quad per maximal rectangle of exposed faces (colour is
  // looked up per fragment, so faces merge regardless of colour). Positions in chunk-local cell units 0..32.
  const MASK = new Uint8Array(CS * CS);
  function greedy(occ) {
    const pos = [], nrm = [], idx = [], st = [1, P, P2], c = [0, 0, 0];
    let nv = 0;
    for (let a = 0; a < 3; a++) {
      const u = (a + 1) % 3, v = (a + 2) % 3, sa = st[a], su = st[u], sv = st[v];
      for (let s = 1; s >= -1; s -= 2) {
        const off = s * sa;
        for (let k = 0; k < CS; k++) {
          const base = 1 + P + P2 + k * sa;
          let any = 0;
          for (let j = 0; j < CS; j++) {
            let p = base + j * sv;
            for (let i = 0; i < CS; i++, p += su) {
              const f = occ[p] && !occ[p + off] ? 1 : 0;
              MASK[i | (j << 5)] = f; any |= f;
            }
          }
          if (!any) continue;
          const plane = s > 0 ? k + 1 : k;
          for (let j = 0; j < CS; j++) {
            for (let i = 0; i < CS;) {
              if (!MASK[i | (j << 5)]) { i++; continue; }
              let w = 1;
              while (i + w < CS && MASK[(i + w) | (j << 5)]) w++;
              let h = 1;
              grow: for (; j + h < CS; h++) {
                const r = (j + h) << 5;
                for (let q = 0; q < w; q++) if (!MASK[(i + q) | r]) break grow;
              }
              for (let y = 0; y < h; y++) MASK.fill(0, i + ((j + y) << 5), i + w + ((j + y) << 5));
              c[a] = plane;
              c[u] = i; c[v] = j; pos.push(c[0], c[1], c[2]);
              c[u] = i + w; pos.push(c[0], c[1], c[2]);
              c[v] = j + h; pos.push(c[0], c[1], c[2]);
              c[u] = i; pos.push(c[0], c[1], c[2]);
              const n0 = a === 0 ? s : 0, n1 = a === 1 ? s : 0, n2 = a === 2 ? s : 0;
              nrm.push(n0, n1, n2, n0, n1, n2, n0, n1, n2, n0, n1, n2);
              // (e_u x e_v) = e_a: counter-clockwise seen from +a for the positive face.
              if (s > 0) idx.push(nv, nv + 1, nv + 2, nv, nv + 2, nv + 3);
              else idx.push(nv, nv + 2, nv + 1, nv, nv + 3, nv + 2);
              nv += 4;
              i += w;
            }
          }
        }
      }
    }
    return { pos: new Float32Array(pos), nrm: new Int8Array(nrm), idx: nv > 65535 ? new Uint32Array(idx) : new Uint16Array(idx), quads: nv / 4 };
  }

  // First-person player: an AABB (feet centre p) swept per axis through the grid, with step-up / step-down.
  const G_MS2 = 9.81;
  class Player {
    constructor(world, mpu) {
      this.w = world;
      this.k = 1 / (mpu * world.edge);  // cells per metre
      this.p = [0, 0, 0]; this.v = [0, 0, 0];
      this.hw = 0.25 * this.k;
      this.onGround = false; this.crouched = false;
      this.eyeM = 1.6; this.stepOff = 0;  // eye height (m, eased) and step smoothing (cells, decays to 0)
      this.stepM = 0.26; this.respawns = 0; this.jumps = 0;
    }
    height(crouched = this.crouched) { return (crouched ? 1.2 : 1.75) * this.k; }
    overlaps(h = this.height()) {
      const p = this.p, hw = this.hw, w = this.w;
      const x0 = Math.floor(p[0] - hw + EPS), x1 = Math.floor(p[0] + hw - EPS);
      const y0 = Math.floor(p[1] + EPS), y1 = Math.floor(p[1] + h - EPS);
      const z0 = Math.floor(p[2] - hw + EPS), z1 = Math.floor(p[2] + hw - EPS);
      for (let y = y0; y <= y1; y++) for (let z = z0; z <= z1; z++) for (let x = x0; x <= x1; x++) if (w.solid(x, y, z)) return true;
      return false;
    }
    // Lift out of solid cells (spawn, teleport, a placed voxel): up to 2 m, in quarter cells.
    unstick() {
      if (!this.overlaps()) return true;
      const y = this.p[1];
      for (let d = 0.25; d <= 2 * this.k; d += 0.25) {
        this.p[1] = y + d;
        if (!this.overlaps()) { this.p[1] = Math.floor(this.p[1] + EPS) + SKIN; if (this.overlaps()) this.p[1] = y + d; return true; }
      }
      this.p[1] = y;
      return false;
    }
    // Nearest free standing spot (spawn inside furniture or a wall): square rings of 5 cm steps out to maxR
    // cells, each tried at the same height and up to stepM higher; else lift straight up (unstick). With a
    // facing dir [x,z] (spawn), spots up to 0.6 m further out that can walk 0.5 m forward win over blocked ones.
    findFree(maxR, dir) {
      const p = this.p, x0 = p[0], y0 = p[1], z0 = p[2];
      const st = Math.max(1, Math.round(0.05 * this.k)), up = Math.ceil(this.stepM * this.k), extra = 0.6 * this.k;
      const cands = [];
      let firstR = -1;
      for (let r = 0; r <= maxR && (firstR < 0 || (dir && r <= firstR + extra)); r += st) {
        for (let dz = -r; dz <= r; dz += st) for (let dx = -r; dx <= r; dx += st) {
          if (Math.max(Math.abs(dx), Math.abs(dz)) < r) continue;
          for (let dy = 0; dy <= up; dy += st) {
            p[0] = x0 + dx; p[1] = y0 + dy; p[2] = z0 + dz;
            if (!this.overlaps()) { cands.push([p[0], p[1], p[2], dx * dx + dz * dz + dy * dy]); break; }
          }
        }
        if (cands.length && firstR < 0) { firstR = r; if (!dir) break; }
      }
      let best = null, bs = Infinity;
      for (const c of cands) {
        let s = c[3];
        if (dir) {
          p[0] = c[0]; p[1] = c[1]; p[2] = c[2];
          this.sweep(0, dir[0] * 0.5 * this.k); this.sweep(2, dir[1] * 0.5 * this.k);
          if ((p[0] - c[0]) ** 2 + (p[2] - c[2]) ** 2 < (0.45 * this.k) ** 2) s += 1e9;
        }
        if (s < bs) { bs = s; best = c; }
      }
      if (best) { p[0] = best[0]; p[1] = best[1]; p[2] = best[2]; return true; }
      p[0] = x0; p[1] = y0; p[2] = z0;
      return this.unstick();
    }
    layerSolid(axis, L, o1, a0, a1, o2, b0, b1) {
      const c = [0, 0, 0];
      c[axis] = L;
      for (let a = a0; a <= a1; a++) {
        c[o1] = a;
        for (let b = b0; b <= b1; b++) { c[o2] = b; if (this.w.solid(c[0], c[1], c[2])) return true; }
      }
      return false;
    }
    // Move along one axis by d (cells), stopping SKIN short of the first solid layer. Returns true if blocked.
    sweep(axis, d) {
      if (d === 0) return false;
      const p = this.p, hw = this.hw, h = this.height();
      const mn = [p[0] - hw, p[1], p[2] - hw], mx = [p[0] + hw, p[1] + h, p[2] + hw];
      const o1 = (axis + 1) % 3, o2 = (axis + 2) % 3;
      const a0 = Math.floor(mn[o1] + EPS), a1 = Math.floor(mx[o1] - EPS), b0 = Math.floor(mn[o2] + EPS), b1 = Math.floor(mx[o2] - EPS);
      if (d > 0) {
        const s = Math.floor(mx[axis] - EPS) + 1, e = Math.floor(mx[axis] + d - EPS);
        for (let L = s; L <= e; L++) if (this.layerSolid(axis, L, o1, a0, a1, o2, b0, b1)) { p[axis] += Math.min(d, L - SKIN - mx[axis]); return true; }

  teleport(pos, y, p) { if (!player) return false; placePlayer(toCell(pos[0], pos[1], pos[2]), y, p); return true; },
  respawn: () => respawn(),

      texVersion: holeTex ? holeTex.version : null, meshVersion: splatMesh ? splatMesh.version : null,
      shaderHasMask: prog ? prog.shader.includes("holeQ") : null, check: holeCheck,
      fullShaderHasMask: progF ? progF.shader.includes("holeQ") : null,
      generatorError: splatMesh?.generatorError ? String(splatMesh.generatorError).slice(0, 300) : null,

  // CPU mirror of the GPU rule for a splat centred at world (x,y,z) with largest std-dev `scale` (world units,

    const cls = VX.holeClass(d, scale / hc, holeSMax(), holeRim()), cav = VX.holeCavity(holeData, holeDims, world.origin, hc, [x, y, z]);

function eyeHeightM() {
  if (!player) return null;
  const top = world.floorBelow(player.p[0], player.p[1] + 0.5, player.p[2], mToCells(3));
  if (top === null) return null;
  return +((eyeCell()[1] - top) * world.edge * MPU).toFixed(3);
}

// ------------------------------------------------------------ boot: voxels first, then play; splats behind
async function boot() {
  setLoad(0, "Loading voxels…");
  const mb = (CFG.voxel.bytes / 1e6).toFixed(1);
  const bytes = await dataBytes(CFG.voxel, (f) => setLoad(0.5 * f, `Loading voxels ${Math.round(100 * f)}% (${mb} MB)…`));
  setLoad(0.5, "Decoding voxels…");
  await yieldTask();
  world = VX.decodeVXG1(bytes, CFG.voxel);
  const list = [...world.chunks.values()];
  let t = performance.now();
  for (let i = 0; i < list.length; i++) {
    buildChunk(list[i]);
    if (performance.now() - t > 30) { setLoad(0.5 + 0.5 * i / list.length, `Building world ${i + 1}/${list.length} chunks…`); await yieldTask(); t = performance.now(); }
  }
  world.dirty.clear();
  initHoleGrid();
  player = new VX.Player(world, MPU);
  const sp = CFG.spawn, eyeW = sp.position, look = sp.look_at;
  const dx = look[0] - eyeW[0], dy = look[1] - eyeW[1], dz = look[2] - eyeW[2];
  spawnYaw = Math.atan2(-dx, -dz);
  spawnPitch = THREE.MathUtils.clamp(Math.atan2(dy, Math.hypot(dx, dz)), -PITCH_MAX, PITCH_MAX);
  const eyeM = CFG.eyeHeightM || 1.6;
  spawnFeet = toCell(eyeW[0], eyeW[1] - eyeM / MPU, eyeW[2]);
  floorCellY = toCell(0, sp.floor_y ?? (eyeW[1] - eyeM / MPU), 0)[1];
  bedrockY = Q.get("bedrock") === "0" ? -Infinity : Math.round(floorCellY) - 1;  // top floor layer breaks, the rest holds
  placePlayer(spawnFeet.slice(), spawnYaw, spawnPitch, true);
  spawnFeet = player.p.slice();  // respawn where the spawn search landed
  G.spawnFeet = toWorld(spawnFeet);
  loadEl.classList.add("hidden");
  G.ready = true; G.readyAt = performance.now();
  updatePlay(); showHint();
  applyMode();
  loadSplat();
}

// ------------------------------------------------------------ main loop (fixed 120 Hz physics)
const STEP = 1 / 120;
let acc = 0, lastT = null, hudAt = 0;
// MOVING RESOLUTION (export-viewer block 9, splat mode): start at full DPR; shrink the moving pixel budget 20%
// right after a >18 ms moving frame, probe up 8% after 60 consecutive clean moving frames; floor 0.65 of
// native DPR (?movefloor=0..1); the footprint is 0.85 below full resolution. Still (no move for 200 ms):
// full DPR, footprint 1.
const SLOW_FRAME_MS = 18, MIN_MOVING_PIXELS = 640 * 360, MOVING_FOOTPRINT = 0.85, PACE_SETTLE_MS = 200;
const floorQ = Q.has("movefloor") ? Number(Q.get("movefloor")) : NaN;
const MOVING_FLOOR = Number.isFinite(floorQ) ? Math.min(1, Math.max(0, floorQ)) : 0.65;
let fullMovingPixels = innerWidth * innerHeight * DPR * DPR, movingPixels = fullMovingPixels;
let paceGood = 0, lastPaceAt = 0, wasPaceMoving = false;
const cssSize = new THREE.Vector2();
addEventListener("resize", () => {
  const full = innerWidth * innerHeight * DPR * DPR;
  movingPixels = Math.min(full, movingPixels * full / fullMovingPixels); fullMovingPixels = full;
});
// The canvas is never resized for the scaler (setPixelRatio -> setSize blocked ~70-200 ms in gl.getError
// draining the GPU queue on the M4): it stays at native DPR (<= 2); a moving frame below full resolution
// renders the splat pass into one of a few pre-allocated render targets at quantized scales of the drawing
// buffer and draws it to the canvas with one full-screen quad. The viewer's controller sets the budget; the
// level is the largest one within it, stepping down at once and up at most once per 2 s.
const RES_LEVELS = [1, 0.85, 0.75, 0.65].filter((l) => l >= MOVING_FLOOR - 1e-6);
const RES_UP_MS = 2000;
let resLevel = 1, resLevelAt = -1e9;
const resTargets = new Map();
const bufSize = new THREE.Vector2();
function resolutionLevel(now, moving) {
  let lv = 1;
  if (moving) {
    const c = renderer.getSize(cssSize), want = Math.min(1, Math.sqrt(movingPixels / (c.x * c.y * DPR * DPR)));
    lv = RES_LEVELS[RES_LEVELS.length - 1];
    for (const l of RES_LEVELS) if (l <= want + 1e-6) { lv = l; break; }
    if (lv > resLevel && now - resLevelAt < RES_UP_MS) lv = resLevel;
  }
  if (lv !== resLevel) { resLevel = lv; resLevelAt = now; }
  return lv;
}
function targetFor(level) {
  renderer.getDrawingBufferSize(bufSize);
  const w = Math.max(1, Math.round(bufSize.x * level)), hh = Math.max(1, Math.round(bufSize.y * level));
  let t = resTargets.get(level);
  if (!t) {
    t = new THREE.WebGLRenderTarget(w, hh, { depthBuffer: true });
    t.texture.colorSpace = THREE.SRGBColorSpace;
    t.texture.minFilter = t.texture.magFilter = THREE.LinearFilter;
    t.texture.generateMipmaps = false;
    t.isXRRenderTarget = true;  // three/Spark write display (sRGB) values, as into the canvas (export-viewer's trick)
    resTargets.set(level, t);
  } else if (t.width !== w || t.height !== hh) t.setSize(w, hh);
  return t;
}
const blitCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const blit = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), new THREE.ShaderMaterial({
  glslVersion: THREE.GLSL3, depthTest: false, depthWrite: false,
  uniforms: { map: { value: null }, size: { value: new THREE.Vector2(1, 1) } },
  vertexShader: "void main() { gl_Position = vec4(position.xy, 0.0, 1.0); }",
  fragmentShader: "layout(location = 0) out highp vec4 outColor;\nuniform sampler2D map;\nuniform vec2 size;\n" +
    "void main() { outColor = texture(map, gl_FragCoord.xy / size); }" }));

  if (level >= 1) { renderer.render(scene, cam); return; }
  const t = targetFor(level);
  renderer.setRenderTarget(t);
  renderer.render(scene, cam);
  renderer.setRenderTarget(null);
  blit.material.uniforms.map.value = t.texture;
  renderer.getDrawingBufferSize(blit.material.uniforms.size.value);
  renderer.render(blit, blitCam);
}
const IDLE = Q.get("idle") !== "0";
let idleNow = false, sortSeen = "", needSettled = false, lastDrawn = null, dirtyAt = 0;
const touch = () => { dirtyAt = performance.now(); };
addEventListener("resize", touch);
function pace(now, moving) {
  const dt = now - lastPaceAt; lastPaceAt = now;
  const consecutive = moving && wasPaceMoving; wasPaceMoving = moving;
  if (!consecutive) { paceGood = 0; return; }
  const c = renderer.getSize(cssSize), full = c.x * c.y * DPR * DPR;
  if (dt > SLOW_FRAME_MS) {
    movingPixels = Math.max(Math.min(full, MIN_MOVING_PIXELS), full * MOVING_FLOOR * MOVING_FLOOR, movingPixels * 0.8);
    paceGood = 0;

    paceGood = 0; movingPixels = Math.min(full, movingPixels * 1.08);

}
let regenPos = null, regenDir = null;
const statsEl = $("stats");
let hudFlash = null, hudHit = null, hudText = "";
function regenDue() {  // Spark regenerates (SH + order) at most per 1 deg turn / 2 cm move, or after an edit
  const p = camera.position, d = camera.getWorldDirection(_v3);
  const due = forceRegen || !regenPos || d.angleTo(regenDir) > Math.PI / 180 || p.distanceTo(regenPos) > 0.02 / MPU;
  if (due) { regenPos = p.clone(); regenDir = d.clone(); forceRegen = false; }
  return due;
}
function frame(now) {
  const rawDt = lastT === null ? 1 / 60 : (now - lastT) / 1000;
  lastT = now;
  const dt = Math.min(0.1, Math.max(0, rawDt));
  if (rawDt > 0 && rawDt < 1) {
    emaDt += (rawDt * 1000 - emaDt) * 0.08; fpsSmooth = 1000 / emaDt;
    for (let i = fpsWindows.length - 1; i >= 0; i--) {
      const w = fpsWindows[i];
      w.dts.push(rawDt * 1000);
      if (now >= w.until) {
        fpsWindows.splice(i, 1);
        const s = [...w.dts].sort((a, b) => a - b), sum = w.dts.reduce((a, b) => a + b, 0);
        w.res({ fps: +(1000 * s.length / sum).toFixed(1), p50ms: +s[Math.floor(s.length * 0.5)].toFixed(2),
          p95ms: +s[Math.min(s.length - 1, Math.floor(s.length * 0.95))].toFixed(2), frames: s.length });
      }
    }
  }
  if (G.ready && camPin) {  // SCRIPT CAMERA: exact pose, no input or physics (effects keep running)
    updateEffects(dt);
    camera.position.copy(camPin.pos);
    camera.quaternion.copy(camPin.quat);
  } else if (G.ready) {
    const gp = readPad();
    // look
    if (gp) {
      const [rx, ry, rm] = gp.R;
      if (rm > 0) {
        const curve = Math.pow(rm, 1.8) / rm;  // keep direction, ease small deflections
        yaw -= rx * curve * 2.8 * dt;
        pitch = THREE.MathUtils.clamp(pitch - ry * curve * 2.0 * dt, -PITCH_MAX, PITCH_MAX);
      }
    }
    if (keys.has("ArrowLeft")) yaw += 2.2 * dt;
    if (keys.has("ArrowRight")) yaw -= 2.2 * dt;
    // move intent (wish direction in the ground plane)
    let fx = 0, sx = 0;
    if (keys.has("KeyW") || keys.has("ArrowUp")) fx += 1;
    if (keys.has("KeyS") || keys.has("ArrowDown")) fx -= 1;
    if (keys.has("KeyD")) sx += 1;
    if (keys.has("KeyA")) sx -= 1;
    const km = Math.hypot(fx, sx); if (km > 1) { fx /= km; sx /= km; }
    if (gp && gp.L[2] > 0) { fx = -gp.L[1]; sx = gp.L[0]; }
    const sy = Math.sin(yaw), cy = Math.cos(yaw);
    const inp = { wx: -sy * fx + cy * sx, wz: -cy * fx - sy * sx,
      sprint: keys.has("ShiftLeft") || keys.has("ShiftRight") || (gp && gp.cur[10]),
      crouch: keys.has("KeyC") || keys.has("ControlLeft") || keys.has("ControlRight") || (gp && gp.cur[1]), jump: false };
    if (gp && gp.edge[0]) jumpBuffer = 0.15;
    const holdJump = keys.has("Space") || (gp && gp.cur[0]);
    if (gp && gp.edge[3]) toggleMode();
    // physics
    acc = Math.min(acc + dt, 12 * STEP);
    while (acc >= STEP) {
      prevEye[0] = curEye[0]; prevEye[1] = curEye[1]; prevEye[2] = curEye[2];
      inp.jump = jumpBuffer > 0 || holdJump;
      const g0 = player.onGround;
      player.step(STEP, inp);
      if (g0 && !player.onGround && player.v[1] > 0) jumpBuffer = 0;
      jumpBuffer = Math.max(0, jumpBuffer - STEP);
      if (player.p[1] < floorCellY - mToCells(3)) respawn();
      const e = eyeCell(); curEye[0] = e[0]; curEye[1] = e[1]; curEye[2] = e[2];
      acc -= STEP;
    }
    // fire (RT / held mouse, ~6/s) and place (LT / right click)
    const t = performance.now();
    if ((mouseFire || (gp && gp.cur[7])) && t >= nextShotAt) { shoot(); nextShotAt = t + 1000 / 6; }
    if (gp && gp.cur[6] && t >= nextPlaceAt) { placeVoxel(); nextPlaceAt = t + 250; }
    updateEffects(dt);
    const al = acc / STEP;
    const eye = toWorld([prevEye[0] + (curEye[0] - prevEye[0]) * al, prevEye[1] + (curEye[1] - prevEye[1]) * al, prevEye[2] + (curEye[2] - prevEye[2]) * al]);
    camera.position.set(eye[0], eye[1], eye[2]);
    camera.rotation.set(pitch, yaw, 0, "YXZ");
  }
  camera.updateMatrixWorld();
  // still = no pose / projection change (a pinned setCamera counts as still)
  if (!sameMatrix(camera.matrixWorld, lastView) || !sameMatrix(camera.projectionMatrix, lastProj)) {
    lastView.copy(camera.matrixWorld); lastProj.copy(camera.projectionMatrix); movedAt = now;
  }
  const still = now - movedAt >= SETTLE_MS;
  // splat mode: hole upload, motion LOD, regen throttle, MOVING RESOLUTION (below).
  const splatOn = mode === "splat" && !!splatMesh;
  if (holeData) runHoleJobs();
  if (splatMesh) checkHoleModifier();
  let cam = camera, level = 1;
  if (splatOn) {
    uploadHoles();
    syncCams();
    const was = presented;
    const lodKey = Math.max(movedAt, lodChangedAt), lodStill = now - lodKey >= SETTLE_MS;
    if (!meshF || !lodStill) presented = "I";
    else if (presented === "I") {
      if (fullKick !== lodKey && !sparkF.sorting) {  // regenerate + sort the full model for this pose, off screen
        fullKick = lodKey; fullKickAt = performance.now();
        sparkF.sortDirty = true; sparkF.setDirty();
        sparkF.update({ scene, camera: camF }).catch((e) => console.error("full sort", e));
      }
      if (fullKick === lodKey && fullSorted()) presented = "F";
    }
    if (presented !== was) forceRegen = true;
    const S = presented === "F" ? sparkF : spark;
    cam = presented === "F" ? camF : camI;
    const moving = now - movedAt < PACE_SETTLE_MS;
    // IDLE RULE (as export-viewer): with the camera still and nothing changing, stop redrawing; the canvas keeps
    // its last frame and the GPU queue stays empty (the next moving frame starts cheap). Held while: the full
    // model is up and settled, or it is sorting off screen for this pose (<= 4 s; the interactive frame stays).
    const sortKey = presented + ":" + S.lastSortTime;
    if (!S.sorting && sortKey !== sortSeen) { sortSeen = sortKey; needSettled = true; }  // POST-SORT FRAME
    const quiet = now - movedAt > 600 && now - dirtyAt > 600 && !forceRegen && !S.sorting && !S.sortDirty &&
      !nDebris && !nSparks && !nPuffs && !holeJobs.length && !holesDirty && presented === lastDrawn;
    const settled = presented === "F" || !meshF || (lodStill && now - lodKey < SETTLE_MS + 4000);
    idleNow = IDLE && quiet && settled && !needSettled;
    if (!idleNow) {
      S.autoUpdate = regenDue();
      pace(now, moving);
      level = resolutionLevel(now, moving);
      const fp = S.material.uniforms.footprintScale;
      if (fp) fp.value = level < 1 ? MOVING_FOOTPRINT : 1;
    }
  } else {
    wasPaceMoving = false; idleNow = false;
  }
  if (!idleNow) {
    if (splatOn) {
      drawSplat(cam, level);
      lastDrawn = presented;
      const S = presented === "F" ? sparkF : spark;
      if (!S.sorting && presented + ":" + S.lastSortTime === sortSeen && level === 1) needSettled = false;
    } else renderer.render(scene, cam);
  }
  for (const s of [spark, sparkF]) if (s) s.autoUpdate = true;
  // HUD
  // DOM writes only on change (flash, crosshair) and the stats text at 4 Hz, only when it differs
  const tn = performance.now(), fl = tn < flashUntil, hi = tn < hitUntil;
  if (fl !== hudFlash) { hudFlash = fl; flashEl.style.opacity = fl ? "1" : "0"; }
  if (hi !== hudHit) { hudHit = hi; crossEl.classList.toggle("hit", hi); }
  if (HUD && G.ready && now - hudAt > 250) {
    hudAt = now;
    const eh = eyeHeightM();
    const splatNote = mode !== "splat" ? "" : !splatMesh ? (splatErr ? " unavailable (voxels)" : ` · loading splats ${splatPct}% (voxels meanwhile)`) :
      CFG.splatFull?.parts && !meshF && !fullErr ? ` (full ${fullPct}%)` : presented === "F" ? " full" : "";
    const txt = `<b>${broken.toLocaleString()}</b> voxels broken\n` +
      `${fpsSmooth.toFixed(0)} fps · ${mode.toUpperCase()}${splatNote}\n` +
      `eye ${eh === null ? "–" : eh.toFixed(2)} m · voxel ${CFG.voxel.cm} cm` +
      (player.respawns ? `\nrespawns ${player.respawns}` : "");

}
renderer.setAnimationLoop(frame);
boot().catch(fail);
