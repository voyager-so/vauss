// ------------------------------------------------------------ fps overlay + bench
const fpsEl = document.getElementById("fps");
if (Q.get("fps") === "0") fpsEl.style.display = "none";
const frameDts = [];
let lastFrameAt = 0, lastOverlay = 0;
function overlay(now) {
  if (now - lastOverlay < 250) return;
  lastOverlay = now;
  const n = frameDts.length, ms = n ? frameDts.reduce((a, b) => a + b, 0) / n : 0;
  const pr = renderer.getPixelRatio() / DPR;
  fpsEl.textContent = idleNow ? "idle (view settled)\n" + `${state.variant ?? "…"}` :
    `${ms ? (1000 / ms).toFixed(1) : "–"} fps  ${ms.toFixed(1)} ms\n` +
    `${(shown().activeSplats / 1e6).toFixed(2)}M drawn  res ${(pr * 100).toFixed(0)}% ${moving ? "(moving)" : "(settled)"}`;

const bench = { phase: BENCH ? "wait" : "off" };

function benchStep(now) {
  if (bench.phase === "wait") {

    bench.readyAt ??= now;
    if (!lodIdle() && now - bench.readyAt < 20000) return;

    controls.enabled = false;

// Bench: GPU time per frame (EXT_disjoint_timer_query_webgl2), independent of the vsync cap.
const gl = renderer.getContext();

  bench.phase = "done";

  const c = renderer.getSize(cssSize);
  const r = { variant: state.variant, splats: state.numSplats, budget: state.variant === "lod" ? spark.lodSplatCount : null,
    canvas: `${c.x}x${c.y}@${DPR}`, load_ms: Math.round(bench.loadMs), orbit: stats(bench.orbit), hold: stats(bench.hold),
    orbit_gpu: gpuStats(bench.orbitGpu), hold_gpu: gpuStats(bench.holdGpu),

renderer.setAnimationLoop((now) => {
  // Navigation uses the animation clock, independently of idle / throttled rendering.
  const dt = lastTickAt === null ? 1 / 60 : Math.min(0.1, Math.max(0, (now - lastTickAt) / 1000));
  lastTickAt = now;
  move.set(0, 0, 0);
  const walking = mode === "walk";
  if (walking && walk.sync) { walkFrom(_dir.subVectors(controls.target, camera.position).normalize()); walk.sync = false; }
  if (walking && (walk.dYaw || walk.dPitch)) {  // the look drag, applied once per frame (no smoothing lag)
    walk.yaw -= walk.dYaw; walk.pitch += walk.dPitch;
    walk.dYaw = walk.dPitch = 0;
  }

  right.crossVectors(fwd, up).normalize();

  if (keys.has("KeyS") || keys.has("ArrowDown")) move.sub(fwd);

  if (keys.has("KeyA") || keys.has("ArrowLeft")) move.sub(right);

  }

  if (po && po.length() < 1e-4 * CFG.radius) po.set(0, 0, 0);

  if (BENCH) benchStep(now);

  // full model's sort for this exact view is done (started once per settle, off screen), then swap.
  if (state.variant !== "full") presented = "I";
  else if (!MLOD || !iKey) presented = "F";
