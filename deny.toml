[bans]
# Duplicate versions are common in the burn/wgpu/cubecl graph; report, don't fail.
multiple-versions = "warn"
wildcards = "allow"
deny = [
    { name = "openssl-sys", reason = "use rustls; no system OpenSSL in release binaries" },
    { name = "openssl", reason = "use rustls; no system OpenSSL in release binaries" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Every git dependency is pinned to an exact rev in Cargo.toml / Cargo.lock and is
# permissively licensed (licence fields are checked above like any crate):
allow-git = [
    # burn, pinned to the rev Brush 1388f74c locked (faec3983); MIT OR Apache-2.0.
    "https://github.com/tracel-ai/burn",
    # cubecl, rev 46752244 (pulled in by burn; cubecl-common/cubecl-wgpu are
    # patched from vendor/, the rest comes from git); MIT OR Apache-2.0.
    "https://github.com/tracel-ai/cubecl",
    # cubek kernels, pulled in by burn/cubecl at their pinned revs; MIT OR Apache-2.0.
    "https://github.com/tracel-ai/cubek",
    # Brush author's wgpu fork, rev de4d137a ([patch.crates-io], same as Brush); MIT OR Apache-2.0.
    "https://github.com/ArthurBrussee/wgpu",
    # spark-lib (splat-webexport LOD/SPZ), rev 4eb719af; MIT.
    "https://github.com/sparkjsdev/spark",
    # Not listed: tracel-ai/tracel-llvm (MIT OR Apache-2.0) is in Cargo.lock but
    # outside the resolved graph for these targets even with --all-features.
]
