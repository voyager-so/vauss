# cargo-deny configuration (canonical; cargo-deny 0.20 format).
#
#   cargo deny check licenses bans sources
#   cargo deny --all-features check licenses bans sources
#
# Policy: original Voyager code uses the Preview License; every third-party Rust dependency must be
# under a permissive licence (or MPL-2.0, which is file-level copyleft and only
# requires keeping the MPL files' notices and source available). GPL, AGPL, LGPL,
# SSPL, non-commercial (CC-BY-NC*) and unlicensed crates are rejected by omission
# from `allow`. Release archives carry the full texts via cargo-about
# (scripts/licenses.sh, dist/about.toml).

[graph]
# Check every platform we ship for, so target-specific deps are covered.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
    "wasm32-unknown-unknown",
]

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
    "Unicode-3.0",
    "CDLA-Permissive-2.0", # webpki-roots / Mozilla CA data
    "MPL-2.0",             # file-level copyleft; notices kept in THIRD_PARTY_LICENSES
]

# jpeg-encoder (splat-eval frame JPEGs) is "(MIT OR Apache-2.0) AND IJG". The IJG
# licence is permissive. For this binary dependency the condition is the
# acknowledgement in the documentation, met by THIRD_PARTY_LICENSES.txt
# (dist/about.toml accepts IJG). Source distribution additionally needs the IJG
# README; our own source port (crates/splat-sfm-learned/src/jpeg.rs) carries it in
# crates/splat-sfm-learned/LICENSE-IJG.txt. Scoped to this crate only.
[[licenses.exceptions]]
crate = "jpeg-encoder"
allow = ["IJG"]

# Only the enumerated Voyager crates may use this custom license. The exact
# license text is hash-pinned; no general LicenseRef or unlicensed allowance.

