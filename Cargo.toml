[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["vendor/cubecl-common", "vendor/cubecl-wgpu"]

[workspace.package]
edition = "2024"
version = "0.1.20-rc"
license-file = "LICENSE"
repository = "https://github.com/voyager-so/vauss"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: run state is re-read from journal.jsonl and compared with in-memory values
# (artifact registration); the default parser can be one ULP off, which made equal artifacts differ.
serde_json = { version = "1", features = ["float_roundtrip"] }
schemars = "0.8"
thiserror = "2"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
fs2 = "0.4"
parking_lot = "0.12"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
libc = "0.2"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_SystemServices", "Win32_Security", "Win32_Storage_FileSystem"] }
tempfile = "3"
splat-contracts = { path = "crates/splat-contracts" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
splat-fetch = { path = "crates/splat-fetch" }
splat-core = { path = "crates/splat-core" }
splat-mcp = { path = "crates/splat-mcp" }
splat-agent = { path = "crates/splat-agent" }
# splat-mcp / splat-agent (licenses: rmcp Apache-2.0)
rmcp = { version = "3.5", default-features = false }
splat-eval = { path = "crates/splat-eval" }
splat-sfm = { path = "crates/splat-sfm" }
splat-sfm-learned = { path = "crates/splat-sfm-learned" }
# splat-eval (licenses: image MIT/Apache-2.0, ort MIT/Apache-2.0 + ONNX Runtime MIT,
# rayon MIT/Apache-2.0, base64 MIT/Apache-2.0,
# regex MIT/Apache-2.0, sha2 MIT/Apache-2.0)
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "bmp"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "load-dynamic", "cuda"] }
rayon = "1"
base64 = "0.23"
regex = "1"

# --- splat-train* (forked from Brush 1388f74c, Apache-2.0; see crates/splat-train/NOTICE) ---
# burn pinned to the exact rev Brush 1388f74c locked (branch=main#faec3983).
brush-train = { path = "crates/splat-train", package = "splat-train" }
brush-render = { path = "crates/splat-train-render", package = "splat-train-render" }
brush-dataset = { path = "crates/splat-train-dataset", package = "splat-train-dataset" }
brush-serde = { path = "crates/splat-train-serde", package = "splat-train-serde" }
brush-vfs = { path = "crates/splat-train-vfs", package = "splat-train-vfs" }
brush-loss = { path = "crates/splat-train-loss", package = "splat-train-loss" }
brush-cube = { path = "crates/splat-train-cube", package = "splat-train-cube" }
glam = { version = "0.30", features = ["serde"] }
bytemuck = "1.20"
jpeg-decoder = "0.3"
rand = "0.10.0"
log = "0.4.22"
hashbrown = "0.16"
ball-tree = "0.5.1"
assert_approx_eq = "1.1.0"
async-fn-stream = "0.3"
async_zip = { version = "0.0.18", default-features = false, features = ["tokio", "deflate"] }
parse-size = "1.1"
serde-ply = "0.2.1"
tokio-stream = "0.1"
tokio-util = { version = "0.7.13", features = ["io"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4"
wasm-streams = "0.6"
web-sys = { version = "0.3.74" }
web-time = "1.1.0"
wgpu = { version = "30", default-features = false, features = ["naga-ir"] }
burn = { git = "https://github.com/tracel-ai/burn", rev = "faec398324e203fdf7998318e4889b987fc802fc", default-features = false, features = ["std", "optim", "extension", "cubecl", "fusion"] }
burn-cubecl = { git = "https://github.com/tracel-ai/burn", rev = "faec398324e203fdf7998318e4889b987fc802fc" }
burn-wgpu = { git = "https://github.com/tracel-ai/burn", rev = "faec398324e203fdf7998318e4889b987fc802fc", features = ["exclusive-memory-only"] }
burn-fusion = { git = "https://github.com/tracel-ai/burn", rev = "faec398324e203fdf7998318e4889b987fc802fc" }
gltf = { version = "1.4", default-features = false, features = ["utils"] }

splat-spirula = { path = "crates/splat-spirula" }
ctrlc = { version = "3.5", features = ["termination"] }

splat-brush = { path = "crates/splat-brush" }
splat-fill = { path = "crates/splat-fill" }
splat-inpaint = { path = "crates/splat-inpaint" }
splat-mesh = { path = "crates/splat-mesh" }
splat-shots = { path = "crates/splat-shots" }
splat-webexport = { path = "crates/splat-webexport" }
splat-effects = { path = "crates/splat-effects" }
splat-assets = { path = "crates/splat-assets" }
# splat-assets: axum MIT, tower-http MIT.
axum = "0.8"
tower-http = { version = "0.6", features = ["fs", "cors", "compression-br", "compression-gzip"] }
tower = { version = "0.5", features = ["util"] }
fs4 = { version = "0.13", features = ["sync"] }
# splat-brush: glam MIT/Apache-2.0, fs4 MIT/Apache-2.0, ctrlc MIT/Apache-2.0, brush-* Apache-2.0.

# Keep per-worktree target dirs small (many parallel worktrees on one disk).

[patch."https://github.com/tracel-ai/cubecl"]
cubecl-common = { path = "vendor/cubecl-common" }
cubecl-wgpu = { path = "vendor/cubecl-wgpu" }

[patch.crates-io]
wgpu = { git = "https://github.com/ArthurBrussee/wgpu", rev = "de4d137a5303486913156e094ccf68491fe745af" }
wgpu-core = { git = "https://github.com/ArthurBrussee/wgpu", rev = "de4d137a5303486913156e094ccf68491fe745af" }
wgpu-hal = { git = "https://github.com/ArthurBrussee/wgpu", rev = "de4d137a5303486913156e094ccf68491fe745af" }
wgpu-types = { git = "https://github.com/ArthurBrussee/wgpu", rev = "de4d137a5303486913156e094ccf68491fe745af" }
naga = { git = "https://github.com/ArthurBrussee/wgpu", rev = "de4d137a5303486913156e094ccf68491fe745af" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"

[workspace.lints.clippy]
as_ptr_cast_mut = "warn"
await_holding_lock = "warn"
bool_to_int_with_if = "warn"
char_lit_as_u8 = "warn"
checked_conversions = "warn"
clear_with_drain = "warn"
cloned_instead_of_copied = "warn"
dbg_macro = "warn"
debug_assert_with_mut_call = "warn"
derive_partial_eq_without_eq = "warn"
doc_link_with_quotes = "warn"
doc_markdown = "warn"
empty_enum_variants_with_brackets = "warn"
enum_glob_use = "warn"
equatable_if_let = "warn"
exit = "warn"
expl_impl_clone_on_copy = "warn"
explicit_deref_methods = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
fallible_impl_from = "warn"
filter_map_next = "warn"
flat_map_option = "warn"
float_cmp_const = "warn"
fn_params_excessive_bools = "warn"
fn_to_numeric_cast_any = "warn"
from_iter_instead_of_collect = "warn"
get_unwrap = "warn"
if_let_mutex = "warn"
implicit_clone = "warn"
implied_bounds_in_impls = "warn"
imprecise_flops = "warn"
index_refutable_slice = "warn"
inefficient_to_string = "warn"
infinite_loop = "warn"
into_iter_without_iter = "warn"
invalid_upcast_comparisons = "warn"
iter_filter_is_ok = "warn"
iter_filter_is_some = "warn"
iter_not_returning_iterator = "warn"
iter_on_empty_collections = "warn"
iter_on_single_items = "warn"
iter_without_into_iter = "warn"
large_digit_groups = "warn"
large_include_file = "warn"
large_stack_arrays = "warn"
large_stack_frames = "warn"
large_types_passed_by_value = "warn"
let_unit_value = "warn"
linkedlist = "warn"
lossy_float_literal = "warn"
macro_use_imports = "warn"
manual_assert = "warn"
manual_clamp = "warn"
manual_instant_elapsed = "warn"
manual_is_variant_and = "warn"
manual_let_else = "warn"
manual_ok_or = "warn"
manual_string_new = "warn"
map_err_ignore = "warn"
map_flatten = "warn"
map_unwrap_or = "warn"
match_bool = "warn"
match_wild_err_arm = "warn"
match_wildcard_for_single_variants = "warn"
mem_forget = "warn"
mismatching_type_param_order = "warn"
missing_enforced_import_renames = "warn"
missing_safety_doc = "warn"
mixed_attributes_style = "warn"
mut_mut = "warn"
mutex_integer = "warn"
needless_borrow = "warn"
needless_continue = "warn"
needless_for_each = "warn"
needless_pass_by_ref_mut = "warn"
needless_pass_by_value = "warn"
needless_lifetimes = "warn"
negative_feature_names = "warn"
nonstandard_macro_braces = "warn"
option_as_ref_cloned = "warn"
option_option = "warn"
path_buf_push_overwrite = "warn"
print_stderr = "warn"
ptr_as_ptr = "warn"
ptr_cast_constness = "warn"
pub_underscore_fields = "warn"
pub_without_shorthand = "warn"
rc_mutex = "warn"
readonly_write_lock = "warn"
redundant_type_annotations = "warn"
ref_as_ptr = "warn"
ref_option_ref = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
same_functions_in_if_condition = "warn"
semicolon_if_nothing_returned = "warn"
single_char_pattern = "warn"
single_match_else = "warn"
str_split_at_newline = "warn"
str_to_string = "warn"

string_lit_as_bytes = "warn"
string_lit_chars_any = "warn"
suspicious_command_arg_space = "warn"
suspicious_xor_used_as_pow = "warn"
todo = "warn"
trailing_empty_array = "warn"
trait_duplication_in_bounds = "warn"
tuple_array_conversions = "warn"
undocumented_unsafe_blocks = "warn"
unimplemented = "warn"
uninhabited_references = "warn"
uninlined_format_args = "warn"
unnecessary_safety_doc = "warn"
unnecessary_struct_initialization = "warn"
unnecessary_wraps = "warn"
unnested_or_patterns = "warn"
unused_peekable = "warn"
unused_rounding = "warn"
unused_self = "warn"
use_self = "warn"
useless_transmute = "warn"
verbose_file_reads = "warn"
wildcard_dependencies = "warn"
wildcard_imports = "warn"
zero_sized_map_values = "warn"
redundant_clone = "warn"

iter_over_hash_type = "warn"
missing_assert_message = "warn"
should_panic_without_expect = "warn"

# Too many false positives
significant_drop_tightening = "allow"

# For WASM this is quite common
arc_with_non_send_sync = "allow"

# TODO: More docs
missing_errors_doc = "allow"
new_without_default = "allow"

# # These are meh:
# Annoying: Some functions need Box so don't want to force user to to do this.
# unnecessary_box_returns = "allow"
# Annoying: Some arms logically are different even if they do the same thing.
# match_same_arms = "allow"
# Annoying: operators are fine.
# string_add = "allow"
# string_add_assign = "allow"
# Annoying: I like big functuions what can I say.
too_many_lines = "allow"
too_many_arguments = "allow"
needless_range_loop = "allow"

# This doesn't quite work with Burn:
single_range_in_vec_init = "allow"

# Keep per-worktree target dirs small (many parallel worktrees on one disk).

[profile.release]
# The splat binary ships to fal on every new build: its symbol tables were 37 of 167 MB. Stripping
# them changes no code (panic messages keep file:line; backtraces lose function names). Thin LTO
# grew .text 85 -> 97 MB and took a release build from ~3 to ~16 min, so it stays off.
strip = "symbols"

[profile.dev]
debug = "line-tables-only"
# CEO 2026-10-09 19:22 (disk): agents rebuild in fresh shared targets, so incremental state (2+ GB per target) never
# pays back; keep debug info out of the linked binaries' objects too.
incremental = false
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
opt-level = 2
