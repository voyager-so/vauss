name: Feature request
description: Propose an improvement to Vauss.
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to make?
      description: Describe the use case and what is difficult with the current workflow.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested improvement
      description: Describe the behavior you would like and any alternatives you have tried.
    validations:
      required: true
